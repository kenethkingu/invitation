<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can we go out?</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div id="particlesContainer" class="particles-container"></div>
    
    <main class="container">
        <div class="card" id="mainCard">
            <!-- Ask Screen -->
            <div id="askScreen" class="screen">
                <h1 class="headline">Can we go <em>out</em> sometime?</h1>
                <p class="subtitle">no big plan, no pressure. been thinking of you.</p>
                
                <p class="caption" id="captionText" aria-live="polite"></p>
                
                <div class="button-group" id="buttonGroup">
                    <button id="yesBtn" class="btn btn-primary">Yes</button>
                    <button id="noBtn" class="btn btn-secondary">No</button>
                </div>
                
                <p class="reply-text" id="replyText" aria-live="polite" hidden></p>
            </div>
            
            <!-- Reveal Screen -->
            <div id="revealScreen" class="screen reveal-screen" hidden>
                <div class="pulsing-heart">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="var(--accent)" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <div class="reveal-lines">
                    <p class="reveal-line line-1">I just missed you.</p>
                    <p class="reveal-line line-2">I'll text you the details.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
