<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can we go out?</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    
    <main class="container">
        <div class="card" id="mainCard">
            <h1 class="headline">Can we go <em>out</em> sometime?</h1>
            <p class="subtitle">no big plan, no pressure — just missed you.</p>
            
            <p class="caption" id="captionText" aria-live="polite"></p>
            
            <div class="button-group" id="buttonGroup">
                <button id="yesBtn" class="btn btn-primary">Yes</button>
                <button id="noBtn" class="btn btn-secondary">No</button>
            </div>
            
            <p class="reply-text" id="replyText" aria-live="polite" hidden></p>
            
            <p class="attempt-counter" id="attemptCounter" hidden>attempts: <span id="attemptCount">0</span></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
